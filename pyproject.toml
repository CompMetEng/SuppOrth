[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "supporth"
dynamic = ["version"]
description = "Support-based orthologue integration: runs multiple orthology predictors and unifies their calls into a consensus table"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fabian Moreno-Avitia" }]
keywords = ["orthology", "comparative-genomics", "orthofinder", "sonicparanoid", "broccoli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "pandas>=1.3",
    "biopython>=1.79",
    "matplotlib>=3.4",
    "venny4py>=1.0",
]

[project.urls]
Homepage = "https://github.com/fma91/SuppOrth"
Documentation = "https://github.com/fma91/SuppOrth#readme"
Issues = "https://github.com/fma91/SuppOrth/issues"

[project.optional-dependencies]
viz = ["matplotlib>=3.4", "venny4py>=1.0"]
dev = ["pytest>=7.0"]
release = ["build>=1.2", "twine>=6"]

[project.scripts]
suppOrth = "supporth.cli:main"
supporth = "supporth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "supporth.__version__"}

[tool.setuptools.package-data]
supporth = ["py.typed"]
